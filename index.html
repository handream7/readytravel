<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ReadyTravel - 여행 체크리스트</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-row top-row">
            <div class="left-group">
                <select id="travelSelect" onchange="loadData()">
                    <option value="첫여행">첫여행</option>
                </select>
                <button class="btn-sub add-travel-btn" onclick="addNewTravel()">여행+</button>
            </div>
        </div>

        <div class="header-row middle-row">
            <div class="user-tabs">
                <button id="tab-강민성" class="tab-btn active" onclick="switchUser('강민성')">강민성</button>
                <button id="tab-이지훈" class="tab-btn" onclick="switchUser('이지훈')">이지훈</button>
            </div>
        </div>

        <div class="header-row bottom-row">
            <div class="action-group">
                <button class="btn-load" onclick="openLoadModal()">불러오기 / 한번에입력</button>
                <button class="btn-save" onclick="saveCurrentList()">목록저장(버전) 💾</button>
                <button class="btn-reset" onclick="resetCurrentList()">새목록 🗑️</button>
            </div>
        </div>

        <div class="header-row bottom-row">
            <div class="action-group">
                <button class="btn-main" onclick="openCategoryModal()">카테고리+</button>
                <button class="btn-main" onclick="addItem()">아이템+</button>
                <button id="lockBtn" class="btn-lock" onclick="toggleLock()">순서잠금 🔒</button>
                <button class="btn-sub btn-download" onclick="downloadAsTxt()">다운 📥</button>
            </div>
        </div>
    </header>

    <main id="app">
        <table id="checklistTable">
            <thead>
                <tr>
                    <th>목록</th>
                    <th class="status-col">출발</th>
                    <th class="status-col">귀국</th>
                </tr>
            </thead>
            <tbody id="checklistBody"></tbody>
        </table>
    </main>

    <div id="categoryModal" class="modal">
        <div class="modal-content">
            <h3>카테고리 추가</h3>
            <div class="current-cats-box">
                <label>현재 목록:</label>
                <div id="currentCategoryList" class="cat-preview-tags"></div>
            </div>
            <label>새 카테고리 이름</label>
            <input type="text" id="newCategoryName" placeholder="예: 전자기기">
            <div class="modal-buttons">
                <button class="btn-load" onclick="saveCategory()">추가</button>
                <button class="btn-sub" onclick="closeModal('categoryModal')">취소</button>
            </div>
        </div>
    </div>

    <div id="itemModal" class="modal">
        <div class="modal-content">
            <h3>아이템 추가</h3>
            <label>카테고리 선택</label>
            <select id="categorySelect"></select>
            <label>아이템 이름</label>
            <input type="text" id="newItemName" placeholder="예: 여권">
            <div class="modal-buttons">
                <button class="btn-load" onclick="saveItem()">저장</button>
                <button class="btn-sub" onclick="closeModal('itemModal')">취소</button>
            </div>
        </div>
    </div>

    <div id="loadModal" class="modal">
        <div class="modal-content modal-large scrollable-modal">
            <h3>데이터 통합 관리</h3>
            <div class="load-stack">
                <div class="grid-col">
                    <h4>📁 저장된 버전 목록 (글로벌)</h4>
                    <ul id="savedVersionsDisplay" class="data-list version-list"></ul>
                    <button class="btn-load full-width-btn" onclick="confirmLoadVersion()">버전 불러오기</button>
                </div>
                <div class="grid-col">
                    <h4>📂 카테고리 한번에</h4>
                    <textarea id="bulkCategoryText" rows="6" placeholder="의류&#10;세면도구"></textarea>
                    <button class="btn-main full-width-btn" onclick="uploadBulkCategories()">생성</button>
                </div>
                <div class="grid-col">
                    <h4>📦 아이템 한번에</h4>
                    <p class="guide">카테고리 선택 후 엔터치고 목록 입력</p>
                    <select id="bulkItemCategorySelect" class="full-width-input"></select>
                    <textarea id="bulkItemText" rows="6" placeholder="여권&#10;보조배터리"></textarea>
                    <button class="btn-load full-width-btn" onclick="uploadBulkItems()">생성</button>
                </div>
            </div>
            <div class="modal-buttons vertical-buttons">
                <button class="btn-sub full-width-btn" onclick="closeModal('loadModal')">닫기</button>
            </div>
        </div>
    </div>

    <div id="duplicateModal" class="modal">
        <div class="modal-content">
            <h3>⚠️ 중복 항목 감지</h3>
            <p id="dupMsg" style="font-size: 0.9rem; line-height: 1.5; color: #64748b; margin-bottom: 20px;"></p>
            <div class="modal-buttons" style="flex-direction: column; gap: 8px;">
                <button class="btn-load full-width-btn" id="btnRemoveDup">중복 제외하고 추가</button>
                <button class="btn-main full-width-btn" id="btnKeepDup">이름 뒤에 숫자 붙여 추가</button>
                <button class="btn-sub full-width-btn" onclick="closeModal('duplicateModal')">취소</button>
            </div>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
